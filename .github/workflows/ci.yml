name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare environment
              run: cp .env.example .env

            - name: Start infrastructure
              run: docker compose up -d --build mqtt redis soketi || true

            - name: Fix Mosquitto password permissions
              run: |
                  docker compose run --rm --entrypoint sh mqtt -c '
                    if [ -f /mosquitto/data/passwd ]; then
                      chown mosquitto:mosquitto /mosquitto/data/passwd
                      chmod 600 /mosquitto/data/passwd
                    fi
                  '

            - name: Restart MQTT
              run: docker compose restart mqtt

            - name: Check infrastructure
              run: |
                  docker compose ps -a
                  docker compose logs --no-color mqtt

            - name: Install dependencies
              run: docker compose run --rm app composer install --no-interaction --prefer-dist --no-progress

            - name: Validate Composer
              run: docker compose run --rm app composer validate

            - name: Check formatting
              run: docker compose run --rm app composer format:check

            - name: Static analysis
              run: docker compose run --rm app composer analyse

            - name: Unit and Feature tests
              run: docker compose run --rm app composer test

            - name: MQTT Integration tests
              run: docker compose run --rm -e MQTT_INTEGRATION=1 app composer test:integration

            - name: Show Docker logs on failure
              if: failure()
              run: docker compose logs --no-color
